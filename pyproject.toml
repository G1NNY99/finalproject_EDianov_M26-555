[project]
name = "valutatrade-hub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.valutatrade]
data_dir = "data"
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"
rates_ttl_seconds = 300
base_currency = "USD"
log_format = "text"
log_level = "INFO"
log_file = "logs/actions.log"
